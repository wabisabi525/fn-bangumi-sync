<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞牛番组管家</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
<style>
:root {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --surface-soft: #f8f8fb;
  --sidebar: #27233f;
  --sidebar-muted: #aaa8c0;
  --text: #172033;
  --muted: #7d8498;
  --line: #e8e9f1;
  --primary: #6557e8;
  --primary-strong: #5544d2;
  --primary-soft: #efedff;
  --success: #2d9469;
  --success-soft: #e8f7f0;
  --warning: #a66a17;
  --warning-soft: #fff3dd;
  --danger: #d94a57;
  --shadow: 0 8px 28px rgba(32, 39, 71, 0.07);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); transition: background .2s ease, color .2s ease; }
button, input, select { font: inherit; }
button { cursor: pointer; }
.app-shell { min-height: 100vh; padding: 28px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 26px; transition: grid-template-columns .22s ease; }
.app-shell.sidebar-collapsed { grid-template-columns: 76px minmax(0, 1fr); }
.app-shell.sidebar-collapsed .workspace-sidebar { padding-left: 10px; padding-right: 10px; }
.app-shell.sidebar-collapsed .workspace-label, .app-shell.sidebar-collapsed .nav-label, .app-shell.sidebar-collapsed .sidebar-footer-copy, .app-shell.sidebar-collapsed #sidebarToggleText { display: none; }
.app-shell.sidebar-collapsed .workspace-head { justify-content: center; }
.app-shell.sidebar-collapsed .sidebar-toggle { width: 42px; padding: 9px 0; }
.app-shell.sidebar-collapsed .workspace-nav a { padding: 12px 6px; justify-content: center; }
.app-shell.sidebar-collapsed .nav-icon { margin: 0; font-size: 18px; }
.app-shell.sidebar-collapsed .sidebar-footer { padding-left: 0; padding-right: 0; }
.app-shell.sidebar-collapsed .sidebar-footer-row { justify-content: center; }
.workspace-sidebar { position: sticky; top: 28px; height: calc(100vh - 56px); background: var(--sidebar); color: #f4f2ff; border-radius: 24px; padding: 24px 18px; display: flex; flex-direction: column; box-shadow: 0 18px 45px rgba(39, 35, 63, .22); }
.workspace-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.workspace-label { padding: 0 12px; color: #817e98; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.sidebar-toggle { border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.07); color: #d7d4e7; border-radius: 10px; padding: 7px 9px; font-size: 11px; font-weight: 700; transition: background .18s ease; }
.sidebar-toggle:hover { background: rgba(255,255,255,.13); }
.workspace-nav { display: grid; gap: 5px; }
.workspace-nav a { color: var(--sidebar-muted); text-decoration: none; padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 11px; transition: background .18s ease, color .18s ease, transform .18s ease; }
.nav-icon { width: 18px; flex: 0 0 18px; text-align: center; font-size: 16px; line-height: 1; }
.workspace-nav a:hover { color: white; background: rgba(255,255,255,.08); transform: translateX(2px); }
.workspace-nav a.active { background: var(--primary); color: #fff; box-shadow: 0 8px 18px rgba(101,87,232,.28); }
.sidebar-footer { margin-top: auto; border-top: 1px solid rgba(255,255,255,.1); padding: 18px 10px 2px; }
.sidebar-footer-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sidebar-footer-copy { min-width: 0; }
.sidebar-footer-title { font-size: 13px; font-weight: 700; }
.sidebar-footer-state { display: block; margin-top: 3px; color: var(--sidebar-muted); font-size: 11px; }
.content { min-width: 0; padding: 6px 0 44px; }
.page-view[hidden] { display: none !important; }
.bangumi-page { max-width: 860px; }
.bangumi-page .panel { max-width: 680px; }
.bangumi-page-actions { display: flex; gap: 10px; }
.settings-grid.single-column { grid-template-columns: 1fr; }
.page-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
.page-header h1 { margin: 0 0 7px; font-size: clamp(26px, 3vw, 34px); line-height: 1.15; letter-spacing: -.03em; }
.page-header p { margin: 0; color: var(--muted); font-size: 14px; }
.header-actions { display: flex; gap: 10px; flex: 0 0 auto; }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-size: 14px; font-weight: 700; transition: transform .16s ease, opacity .16s ease, background .16s ease; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(101,87,232,.22); }
.btn-primary:hover { background: var(--primary-strong); }
.btn-secondary { background: var(--surface-soft); color: #50586d; border: 1px solid var(--line); }
.btn-danger { background: #fff0f1; color: var(--danger); border: 1px solid #f7d7da; }
.status-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
.status-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.status-label { color: var(--muted); font-size: 13px; }
.status-value { margin: 9px 0 6px; font-size: 26px; line-height: 1; font-weight: 800; letter-spacing: -.03em; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.status-note { color: var(--success); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-note::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: currentColor; vertical-align: 1px; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(330px, .78fr); gap: 18px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 18px; }
.panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 15px; }
.panel-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
.panel-meta { color: var(--muted); font-size: 12px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
td { padding: 14px 12px; border-bottom: 1px solid #eff0f5; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .15s ease; }
tbody tr:hover { background: var(--surface-soft); }
.badge { display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 750; white-space: nowrap; }
.badge-green { background: var(--success-soft); color: var(--success); }
.badge-yellow { background: var(--warning-soft); color: var(--warning); }
.control-stack { display: grid; gap: 12px; }
.control-box { padding: 14px; border: 1px solid var(--line); background: var(--surface-soft); border-radius: 15px; }
.control-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.control-title { display: block; font-size: 13px; font-weight: 750; }
.control-help { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.4; }
.form-group { margin-bottom: 13px; }
.form-group:last-child { margin-bottom: 0; }
.form-group label { display: block; margin-bottom: 6px; color: #545c70; font-size: 12px; font-weight: 700; }
.form-group input, .form-group select { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 12px; padding: 10px 12px; outline: none; transition: border .18s ease, box-shadow .18s ease; }
.form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(101,87,232,.13); }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
.action-grid .btn:first-child { grid-column: 1 / -1; }
.switch { position: relative; display: inline-block; width: 44px; height: 25px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; border-radius: 999px; background: #cbd0dc; transition: .2s; }
.slider::before { content: ""; position: absolute; width: 19px; height: 19px; left: 3px; top: 3px; background: #fff; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,.18); transition: .2s; }
.switch input:checked + .slider { background: var(--primary); }
.switch input:checked + .slider::before { transform: translateX(19px); }
.switch input:focus-visible + .slider { box-shadow: 0 0 0 3px rgba(101,87,232,.22); }
.terminal { background: #161827; color: #c4c8d8; border: 1px solid #242739; border-radius: 15px; padding: 14px; height: 220px; overflow-y: auto; font: 12px/1.65 Consolas, "SFMono-Regular", monospace; }
.terminal div + div { margin-top: 3px; }
.terminal-state { display: inline-flex; align-items: center; gap: 6px; color: var(--success); }
.terminal-state::before { content: ""; width: 7px; height: 7px; background: currentColor; border-radius: 50%; }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
.settings-grid .panel { margin-top: 0; }
.filter-box { background: var(--primary-soft); border: 1px solid #ded9ff; border-radius: 15px; padding: 14px; }
.toast-container { position: fixed; right: 26px; top: 26px; z-index: 100; display: grid; gap: 10px; pointer-events: none; }
.toast { min-width: 260px; max-width: 380px; padding: 13px 15px; border-radius: 13px; background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: 0 14px 38px rgba(24,28,50,.18); transform: translateX(120%); opacity: 0; transition: .28s ease; font-size: 13px; font-weight: 650; }
.toast.show { transform: translateX(0); opacity: 1; }
.theme-button { border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.08); color: #fff; border-radius: 10px; padding: 7px 9px; font-size: 11px; font-weight: 700; }
.syncing { animation: pulse 1.5s infinite; }
@keyframes pulse { 50% { opacity: .48; } }
.mobile-nav { display: none; }
body.dark-mode {
  --bg: #11131d;
  --surface: #191c28;
  --surface-soft: #161923;
  --text: #eff1f7;
  --muted: #969cad;
  --line: #2a2e3b;
  --primary-soft: #26213f;
  --success-soft: #16362c;
  --warning-soft: #3b2c17;
  --shadow: none;
}
.dark-mode .status-note { color: #62d39d; }
.dark-mode td { border-color: #292d3a; }
.dark-mode .form-group label { color: #c7cbd8; }
.dark-mode .filter-box { border-color: #393153; }
.dark-mode .btn-secondary { color: #d4d7e1; }
.dark-mode .btn-danger { background: #382126; border-color: #563038; }
.dark-mode .terminal { background: #0e1017; }
@media (max-width: 1120px) {
  .status-grid { grid-template-columns: repeat(2, 1fr); }
  .dashboard-grid { grid-template-columns: 1fr; }
  .right-column { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .right-column .panel { margin-top: 0; }
}
@media (max-width: 820px) {
  .app-shell, .app-shell.sidebar-collapsed { padding: 16px; grid-template-columns: 1fr; gap: 16px; }
  .app-shell.sidebar-collapsed .workspace-sidebar { padding: 14px; }
  .app-shell.sidebar-collapsed .workspace-label, .app-shell.sidebar-collapsed .nav-label { display: inline; }
  .app-shell.sidebar-collapsed #sidebarToggleText { display: inline; }
  .app-shell.sidebar-collapsed .workspace-head { justify-content: space-between; }
  .app-shell.sidebar-collapsed .workspace-nav a { padding: 10px 12px; font-size: 14px; }
  .app-shell.sidebar-collapsed .workspace-nav a::after { content: none; }
  .workspace-sidebar { position: static; height: auto; padding: 14px; border-radius: 18px; }
  .workspace-label, .sidebar-footer, .sidebar-toggle { display: none; }
  .workspace-nav { display: flex; overflow-x: auto; }
  .workspace-nav a { flex: 0 0 auto; padding: 10px 12px; }
  .page-header { align-items: flex-start; }
  .header-actions { flex-direction: column; }
  .right-column, .settings-grid { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .app-shell { padding: 12px; }
  .page-header { display: block; }
  .header-actions { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; }
  .status-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .status-card { padding: 14px; }
  .status-value { font-size: 22px; }
  .panel { padding: 16px; border-radius: 17px; }
  th:nth-child(1), td:nth-child(1), th:nth-child(4), td:nth-child(4) { display: none; }
  th, td { padding: 12px 8px; }
  .toast-container { left: 12px; right: 12px; top: 12px; }
  .toast { min-width: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="app-shell">
  <aside class="workspace-sidebar">
    <div class="workspace-head">
      <div class="workspace-label">工作区</div>
      <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="收缩工作区" title="收缩工作区"><i class="bi bi-layout-sidebar-inset nav-icon" aria-hidden="true"></i><span id="sidebarToggleText">收起</span></button>
    </div>
    <nav class="workspace-nav" id="workspaceNav">
      <a href="#overview" class="active" data-view="dashboard" title="总览"><i class="bi bi-grid-1x2-fill nav-icon" aria-hidden="true"></i><span class="nav-label">总览</span></a>
      <a href="#records" data-view="dashboard" title="播放记录"><i class="bi bi-play-circle nav-icon" aria-hidden="true"></i><span class="nav-label">播放记录</span></a>
      <a href="#sync-settings" data-view="sync" title="同步设置"><i class="bi bi-arrow-repeat nav-icon" aria-hidden="true"></i><span class="nav-label">同步设置</span></a>
      <a href="#bangumi-settings" data-view="bangumi" title="Bangumi"><i class="bi bi-collection-play nav-icon" aria-hidden="true"></i><span class="nav-label">Bangumi</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-footer-row">
        <div class="sidebar-footer-copy">
          <span class="sidebar-footer-title">外观</span>
          <span class="sidebar-footer-state" id="themeState">日间模式</span>
        </div>
        <button class="theme-button" id="themeBtn" onclick="toggleTheme()">切换</button>
      </div>
    </div>
  </aside>

  <main class="content">
    <div class="page-view" id="dashboardPage">
    <header class="page-header" id="overview">
      <div>
        <h1>飞牛番组管家</h1>
        <p>自动同步观看记录 | 飞牛影视 → Bangumi</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="load()">刷新记录</button>
        <button class="btn btn-primary" onclick="startSync()">立即同步</button>
      </div>
    </header>

    <section class="status-grid">
      <article class="status-card"><div class="status-label">数据库</div><div class="status-value" id="dbStatus">-</div><div class="status-note">连接状态</div></article>
      <article class="status-card"><div class="status-label">待同步</div><div class="status-value" id="pendingCount">-</div><div class="status-note">已达到观看阈值</div></article>
      <article class="status-card"><div class="status-label">同步状态</div><div class="status-value" id="syncState">空闲</div><div class="status-note" id="syncModeNote">手动模式</div></article>
      <article class="status-card"><div class="status-label">上次同步</div><div class="status-value" id="lastSync">-</div><div class="status-note">最近执行时间</div></article>
    </section>

    <div class="dashboard-grid">
      <section class="panel" id="records">
        <div class="panel-heading"><h2>最近播放</h2><button class="btn btn-secondary" onclick="load()">刷新</button></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>时间</th><th>剧名</th><th>集数</th><th>进度</th><th>状态</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>

      <div class="right-column">
        <section class="panel" id="filter-settings">
          <div class="panel-heading"><h2>同步筛选</h2><span class="panel-meta">控制记录范围</span></div>
          <div class="filter-box">
            <div class="form-group"><label for="userSelect">选择用户</label><select id="userSelect" onchange="applyFilter()"><option value="all">全部用户</option></select></div>
            <div class="form-group"><label for="timeRange">时间范围</label><select id="timeRange" onchange="applyFilter()"><option value="all">全部</option><option value="1month">最近1个月</option><option value="1week">最近一周</option><option value="1day">最近一天</option></select></div>
          </div>
        </section>

        <section class="panel" id="logs-panel">
          <div class="panel-heading"><h2>运行日志</h2><span class="terminal-state">实时</span></div>
          <div class="terminal" id="logs"></div>
        </section>
      </div>
    </div>

    </div>

    <section class="page-view bangumi-page" id="syncPage" hidden>
      <header class="page-header">
        <div>
          <h1>同步设置</h1>
          <p>管理同步模式、执行间隔与容器启动行为。</p>
        </div>
        <div class="bangumi-page-actions"><button class="btn btn-secondary" onclick="showDashboard('#overview')">返回总览</button></div>
      </header>
      <section class="panel" id="sync-settings">
        <div class="panel-heading"><h2>同步控制</h2><span class="panel-meta" id="syncModeText">手动模式</span></div>
        <div class="control-stack">
          <div class="control-box">
            <div class="form-group">
              <label for="syncMode">同步模式</label>
              <select id="syncMode" onchange="updateSyncMode('mode')"><option value="manual">手动同步</option><option value="auto">自动同步</option></select>
            </div>
            <div class="form-group" id="intervalGroup" style="display:none;">
              <label for="syncInterval">同步间隔</label>
              <select id="syncInterval" autocomplete="off" onchange="updateSyncMode('interval')">
                <option value="60" {% if config.get('sync_interval', 300) == 60 %}selected{% endif %}>1分钟</option>
                <option value="300" {% if config.get('sync_interval', 300) == 300 %}selected{% endif %}>5分钟</option>
                <option value="900" {% if config.get('sync_interval', 300) == 900 %}selected{% endif %}>15分钟</option>
                <option value="3600" {% if config.get('sync_interval', 300) == 3600 %}selected{% endif %}>1小时</option>
              </select>
            </div>
          </div>
          <div class="control-box">
            <div class="control-row">
              <div><span class="control-title">容器启动后恢复</span><span class="control-help">开启后重启容器会继续运行自动同步。</span></div>
              <label class="switch" aria-label="容器启动后自动同步"><input type="checkbox" id="autoStartOnBoot" onchange="updateSyncMode('boot')"><span class="slider"></span></label>
            </div>
          </div>
        </div>
        <div class="action-grid">
          <button class="btn btn-primary" id="btnSync" onclick="startSync()">立即同步</button>
          <button class="btn btn-danger" id="btnStop" onclick="stopSync()" disabled>停止</button>
          <button class="btn btn-secondary" onclick="if(confirm('确定要清空本地同步记忆吗？\n\n换绑新的 Bangumi 账号后可使用此操作。')) resetCache()">重置记忆</button>
        </div>
      </section>

    </section>

    <section class="page-view bangumi-page" id="bangumiPage" hidden>
      <header class="page-header">
        <div>
          <h1>Bangumi 配置</h1>
          <p>管理 Bangumi 授权信息与观看完成阈值。</p>
        </div>
        <div class="bangumi-page-actions"><button class="btn btn-secondary" onclick="showDashboard('#overview')">返回总览</button></div>
      </header>
      <section class="panel" id="bangumi-settings">
        <div class="panel-heading"><h2>账户配置</h2><span class="panel-meta">Token 将以密码形式显示</span></div>
        <div class="form-group"><label for="token">Access Token</label><input type="password" id="token" placeholder="从 bgm.tv/dev/app 获取"></div>
        <div class="form-group"><label for="pct">最低观看 %</label><input type="number" id="pct" value="80" min="50" max="100"></div>
        <button class="btn btn-primary" style="width:100%;" onclick="save()">保存配置</button>
      </section>
    </section>
  </main>
</div>
<script>
let currentFilter = { user: 'all', range: 'all' };
function showToast(msg) { const c=document.getElementById('toastContainer'); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; c.appendChild(t); void t.offsetWidth; t.classList.add('show'); setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3000); }
async function init(){ await loadUsers(); await loadConfig(); await load(); await loadSyncStatus(); setInterval(getStatus,3000); setInterval(loadSyncStatus,5000); setInterval(load,60000); connectLogs(); initNavigation(); }
async function loadConfig(){ try{const r=await fetch('/api/config?_t='+Date.now());const d=await r.json();if(d.bangumi_token)document.getElementById('token').value=d.bangumi_token;if(d.min_percent)document.getElementById('pct').value=d.min_percent;if(d.user_filter){document.getElementById('userSelect').value=d.user_filter;currentFilter.user=d.user_filter;}if(d.time_range){document.getElementById('timeRange').value=d.time_range;currentFilter.range=d.time_range;}}catch(e){} }
async function loadUsers(){ try{const r=await fetch('/api/users');const d=await r.json();if(d.success&&d.data){const s=document.getElementById('userSelect');s.innerHTML='<option value="all">全部用户</option>';d.data.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.name;s.appendChild(o);});if(currentFilter.user!=='all')s.value=currentFilter.user;}}catch(e){} }
async function load(){ try{const r=await fetch('/api/records?user='+encodeURIComponent(currentFilter.user)+'&range='+encodeURIComponent(currentFilter.range));const d=await r.json();if(d.error)return;const tb=document.getElementById('tbody');tb.innerHTML='';let p=0;d.records.forEach(x=>{if(x.status==='已看完')p++;const tr=document.createElement('tr');tr.innerHTML='<td>'+x.play_time+'</td><td><strong>'+x.media_name+'</strong></td><td>第 '+x.episode_num+' 集</td><td>'+x.percent+'%</td><td><span class="badge '+(x.status==='已看完'?'badge-green':'badge-yellow')+'">'+x.status+'</span></td>';tb.appendChild(tr);});document.getElementById('pendingCount').textContent=p;document.getElementById('dbStatus').textContent='正常';}catch(e){} }
async function getStatus(){ try{const r=await fetch('/api/status');const d=await r.json();const st=document.getElementById('syncState');if(d.syncing){st.textContent='同步中';st.classList.add('syncing');document.getElementById('btnSync').disabled=true;document.getElementById('btnStop').disabled=false;}else{st.textContent='空闲';st.classList.remove('syncing');document.getElementById('btnSync').disabled=false;document.getElementById('btnStop').disabled=true;}}catch(e){} }
async function loadSyncStatus(){ try{const r=await fetch('/api/sync/status?_t='+Date.now());const d=await r.json();if(d.mode)document.getElementById('syncMode').value=d.mode;document.getElementById('autoStartOnBoot').checked=d.auto_start_on_boot===true;if(d.mode==='auto'){document.getElementById('syncModeText').textContent='自动模式';document.getElementById('syncModeNote').textContent='自动模式已开启';document.getElementById('intervalGroup').style.display='block';}else{document.getElementById('syncModeText').textContent='手动模式';document.getElementById('syncModeNote').textContent='手动模式';document.getElementById('intervalGroup').style.display='none';}if(d.last_sync_time)document.getElementById('lastSync').textContent=d.last_sync_time.split(' ')[1].substring(0,5);}catch(e){console.error(e);} }
async function updateSyncMode(source='mode'){const modeSelect=document.getElementById('syncMode');const bootToggle=document.getElementById('autoStartOnBoot');if(source==='boot')modeSelect.value=bootToggle.checked?'auto':'manual';else if(source==='mode')bootToggle.checked=modeSelect.value==='auto';const mode=bootToggle.checked?'auto':'manual';modeSelect.value=mode;const interval=parseInt(document.getElementById('syncInterval').value);const sel=document.getElementById('syncInterval');const intervalText=sel.options[sel.selectedIndex].text;await fetch('/api/sync/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,interval,auto_start_on_boot:bootToggle.checked})});loadSyncStatus();showToast(mode==='auto'?'已开启自动同步，容器重启后将自动恢复（'+intervalText+'）':'已切换为手动模式，容器重启后不自动同步');}
async function applyFilter(){currentFilter.user=document.getElementById('userSelect').value;currentFilter.range=document.getElementById('timeRange').value;await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_filter:currentFilter.user,time_range:currentFilter.range})});await load();const u=document.getElementById('userSelect');const t=document.getElementById('timeRange');showToast('筛选已生效：'+u.options[u.selectedIndex].text+' / '+t.options[t.selectedIndex].text);}
async function save(){const cfg={bangumi_token:document.getElementById('token').value,min_percent:parseInt(document.getElementById('pct').value)};await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});showToast('配置保存成功');load();}
async function startSync(){if(!document.getElementById('token').value){alert('请先填写 Token');return;}showToast('正在依据当前筛选开始同步');await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(currentFilter)});}
async function stopSync(){await fetch('/api/stop',{method:'POST'});showToast('已发送停止请求');}
async function resetCache(){await fetch('/api/sync/reset',{method:'POST'});showToast('本地同步记忆已清空');load();}
async function connectLogs(){const d=document.getElementById('logs');try{const r=await fetch('/api/logs/history');const hist=await r.json();hist.forEach(msg=>{const line=document.createElement('div');line.textContent=msg;d.appendChild(line);});d.scrollTop=d.scrollHeight;}catch(e){}const es=new EventSource('/api/logs');es.onmessage=e=>{if(e.data){const line=document.createElement('div');line.textContent=e.data;d.appendChild(line);d.scrollTop=d.scrollHeight;}};}
function initTheme(){const isDark=localStorage.getItem('theme')==='dark';document.body.classList.toggle('dark-mode',isDark);document.getElementById('themeState').textContent=isDark?'夜间模式':'日间模式';}
function toggleTheme(){document.body.classList.toggle('dark-mode');const isDark=document.body.classList.contains('dark-mode');localStorage.setItem('theme',isDark?'dark':'light');document.getElementById('themeState').textContent=isDark?'夜间模式':'日间模式';}
function setActiveNav(target){const links=[...document.querySelectorAll('.workspace-nav a')];links.forEach(link=>link.classList.toggle('active',link===target));}
function hideSettingsPages(){document.getElementById('syncPage').hidden=true;document.getElementById('bangumiPage').hidden=true;}
function showDashboard(hash='#overview'){document.getElementById('dashboardPage').hidden=false;hideSettingsPages();const target=document.querySelector('.workspace-nav a[href="'+hash+'"]')||document.querySelector('.workspace-nav a[href="#overview"]');setActiveNav(target);if(location.hash!==hash)history.pushState(null,'',hash);requestAnimationFrame(()=>{const section=document.querySelector(hash);if(section)section.scrollIntoView({behavior:'smooth',block:'start'});});}
function showSyncSettings(){document.getElementById('dashboardPage').hidden=true;document.getElementById('syncPage').hidden=false;document.getElementById('bangumiPage').hidden=true;const target=document.querySelector('.workspace-nav a[href="#sync-settings"]');setActiveNav(target);if(location.hash!=='#sync-settings')history.pushState(null,'','#sync-settings');window.scrollTo({top:0,behavior:'smooth'});}
function showBangumi(){document.getElementById('dashboardPage').hidden=true;document.getElementById('syncPage').hidden=true;document.getElementById('bangumiPage').hidden=false;const target=document.querySelector('.workspace-nav a[href="#bangumi-settings"]');setActiveNav(target);if(location.hash!=='#bangumi-settings')history.pushState(null,'','#bangumi-settings');window.scrollTo({top:0,behavior:'smooth'});}
function applyRoute(){if(location.hash==='#sync-settings')showSyncSettings();else if(location.hash==='#bangumi-settings')showBangumi();else showDashboard(location.hash&&document.querySelector(location.hash)?location.hash:'#overview');}
function initNavigation(){document.querySelectorAll('.workspace-nav a').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();if(link.dataset.view==='sync')showSyncSettings();else if(link.dataset.view==='bangumi')showBangumi();else showDashboard(link.getAttribute('href'));}));window.addEventListener('popstate',applyRoute);applyRoute();}
function initSidebar(){const collapsed=localStorage.getItem('sidebarCollapsed')==='true';document.querySelector('.app-shell').classList.toggle('sidebar-collapsed',collapsed);updateSidebarToggle(collapsed);}
function updateSidebarToggle(collapsed){const button=document.getElementById('sidebarToggle');document.getElementById('sidebarToggleText').textContent=collapsed?'展开':'收起';button.setAttribute('aria-label',collapsed?'展开工作区':'收缩工作区');button.title=collapsed?'展开工作区':'收缩工作区';}
function toggleSidebar(){const shell=document.querySelector('.app-shell');const collapsed=!shell.classList.contains('sidebar-collapsed');shell.classList.toggle('sidebar-collapsed',collapsed);localStorage.setItem('sidebarCollapsed',collapsed?'true':'false');updateSidebarToggle(collapsed);}
initTheme();initSidebar();init();
</script>
</body>
</html>
